[package]
name = "nelko-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
autobins = false

[dependencies]
nelko-core.workspace = true
rmcp = { version = "3.10", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"

[dev-dependencies]
rmcp = { version = "3.10", features = ["server", "client", "macros", "transport-io"] }
tempfile = "3"
serde_json = "1"
async-trait = "0.1"

[[bin]]
name = "stickler-mcp"
path = "src/main.rs"
